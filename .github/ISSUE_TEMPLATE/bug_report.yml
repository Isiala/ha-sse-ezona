name: Bug report
description: Report a reproducible integration problem.
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, EICs, private exports, VPN keys or configuration backups. Redact identifying details from logs."
  - type: input
    id: integration
    attributes:
      label: SSE eZóna integration version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: homeassistant
    attributes:
      label: Home Assistant Core version
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: SSE connection
      options:
        - Direct
        - CONNECT proxy / VPN
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
      description: Include steps to reproduce and whether the manual eZóna export works.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted error details
      description: Include error categories and times only; no account identifiers or response bodies.
      render: text
